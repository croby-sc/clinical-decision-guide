
<!DOCTYPE html>
<html>
    <head>
<!--Author: Catherine Roby -->
<!-- Course: Intro to Web Systems ITEC 362-->
<!-- Assignment: Static Website for GitHub Pages-->
<!-- Date: October 2026-->
        <meta charset="UTF-8">
        <title>Clinical Decision Guide- Test Selector</title>

        <link rel="stylesheet" href="styles.css">        
    </head>

    <body>
        <header>
            <div class="logo">
                <img src="images/logo-placeholder.png" alt="Site Logo">
            </div>
            <h1>Clinical Decision Guide</h1>
        </header>
    
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="symptoms.html">Symptoms</a></li>
                <li><a href="tests.html">Test Selector</a></li>
                <li><a href="details.html">Test Details</a></li>
                <li><a href="feedback.html">Provider Feedback</a></li>
            </ul>
        </nav>

    <main>
        <div class="test-layout">

        <!-- LEFT SIDE: heading + image -->
            <div class="test-image-column">
                <h2 class="test-heading">Test Selection Tool</h2>

                <div class="test-image">
                    <img src="images/test-collage-placeholder.png" alt="Diagnostic Imaging Collage">
                </div>
            </div>

        <!-- RIGHT SIDE: dropdown + test list -->
            <div class="test-panel">
                <h3 id="selected-symptom" class="test-details"></h3>

                <div id="test-results" style="display: none;">

                <p class="test-details">Select a test to view details:
                </p>
                    <ul class="test-list" id="test-list">                        
                    </ul>
                </div>
            </div>
        </div>
    </main>

        <footer>
            <p class="footer-text">
            &copy; 2026 Clinical Test Decision Guide - Supporting evidence-based diagnostic workflows  
            </p>
        </footer>
    <script>
        /* 1. Read the symptom from the URL */
        const params = new URLSearchParams(window.location.search);
        const symptom = params.get("symptom");

        /* 2. Get page elements */
        const testResults = document.getElementById("test-results");
        const testList = document.getElementById("test-list");
        const symptomHeading = document.getElementById("selected-symptom");

        /* 3. Your symptom → test lookup table */
        const testsBySymptom = {
            chest: ["ECG", "Chest X-ray", "CT Chest w/contrast", "Stress Test", "Echocardiogram"],
            abdominal: ["Abdominal Ultrasound", "CT Abdomen", "HIDA Scan", "MRI Abdomen"],
            vascular: ["Arterial Duplex", "Venous Duplex", "CTA Runoff"],
            neuro: ["CT Head", "MRI Brain", "EEG", "Carotid Ultrasound"],
            respiratory: ["Chest X-ray", "Pulmonary Embolism CT", "CT Chest", "V/Q Scan"],
            other: ["Tests Coming Soon"]
        };

        /* 4. If a valid symptom was passed, show the correct tests */
        if (symptom && testsBySymptom[symptom]) {

            /* Convert “chest” → “Chest” for the heading */
            const formattedSymptom =
                symptom.charAt(0).toUpperCase() + symptom.slice(1);

            /* Update heading text */
            symptomHeading.textContent = "Tests for " + formattedSymptom + " Symptoms";

            /* Build the clickable test list */
            const tests = testsBySymptom[symptom];

            testList.innerHTML = tests
                .map(test => `<li><a href="details.html?test=${encodeURIComponent(test)}">${test}</a></li>`)
                .join("");

            /* Show the results panel */
            testResults.style.display = "block";
        }
    </script>

    </body>
</html>
